<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff">
  <title>Connecting...</title>
  <style>
    *,*::before,*::after { box-sizing:border-box; }
    html,body { width:100%; min-height:100%; margin:0; }
    body { min-height:100vh; min-height:100dvh; background:#ffffff; display:flex; align-items:center; justify-content:center; font-family:Arial,sans-serif; }
    .loader { display:flex; align-items:center; justify-content:center; gap:14px; width:72px; height:24px; }
    .dot { display:block; flex:none; width:8px; height:8px; border-radius:50%; background:#0b63e5; opacity:.30; transform:scale(.75); animation:dot-wave .9s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay:.15s; }
    .dot:nth-child(3) { animation-delay:.30s; }
    @keyframes dot-wave { 0%,60%,100% { opacity:.30; transform:scale(.75); } 30% { opacity:1; transform:scale(1.45); } }
    .fallback { position:fixed; left:0; right:0; top:calc(50% + 32px); text-align:center; color:#235fc4; font-size:12px; text-decoration:none; }
    .fallback[hidden] { display:none; }
    @media (prefers-reduced-motion:reduce) { .dot { animation:none; opacity:1; transform:none; } }
  </style>
</head>
<body>
  <div class="loader" role="status" aria-label="Connecting to registration">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
  <a id="fallback" class="fallback" href="https://mykvb.com/register?vcode=6rS8oxBAc9zLNrfQvV&amp;utm_source=1001&amp;" hidden>Continue</a>
  <noscript><style>.fallback[hidden]{display:block!important}</style></noscript>
  <script>
    (() => {
      'use strict';
      const targets = [
        'https://mykvb.com/register?vcode=6rS8oxBAc9zLNrfQvV&utm_source=1001&',
        'https://mykvb.com/register?vcode=6rS8oxBAfKXWhSTd0K&utm_source=1001&',
        'https://mykvb.com/register?vcode=6rS8oxBAfhF0OWzoSM&utm_source=1001&'
      ];
      // Select independently on every visit: no saved browser choice.
      const select = () => {
        if (window.crypto && window.crypto.getRandomValues) {
          const values = new Uint32Array(1);
          const limit = Math.floor(4294967296 / targets.length) * targets.length;
          do { window.crypto.getRandomValues(values); } while (values[0] >= limit);
          return values[0] % targets.length;
        }
        return Math.floor(Math.random() * targets.length);
      };
      const destination = targets[select()];
      const fallback = document.getElementById('fallback');
      fallback.href = destination;
      // Briefly display the three-dot animation, then redirect.
      setTimeout(() => { window.location.replace(destination); }, 1050);
      // If the redirect is blocked, expose a direct link to the same selected destination.
      setTimeout(() => { fallback.hidden = false; }, 3500);
    })();
  </script>
</body>
</html>
